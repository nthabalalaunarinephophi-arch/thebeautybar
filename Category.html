<!DOCTYPE html>
<html>
<head>
    <title>CATEGORY</title>
</head>
<script>
function addToCart(productName, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

   cart.push({
    name: productName,
    price: price,
    quantity: 1
});

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(productName + " has been added to your cart!");
}
</script>

<body>
   <h1>ALL CATEGORIES</h1>
    <a href="THE BEAUTY BAR.html" class="home-button">
    Back to home
   </a>
   <h2>FILTER BY</h2>

   <div class="product">
    <h3>Face Cream</h3>
    <p>Price: R120</p>
    <button onclick="addToCart('Face Cream', 120)">
        Add to Cart
    </button>
</div>

<div class="product">
    <h3>Lip Gloss</h3>
    <p>Price: R80</p>
    <button onclick="addToCart('Lip Gloss', 80)">
        Add to Cart
    </button>
</div>

<div class="product">
    <h3>Hair Oil</h3>
    <p>Price: R150</p>
    <button onclick="addToCart('Hair Oil', 150)">
        Add to Cart
    </button>
</div>

   <h3>Sort By</h3>
   <div class="sort-container">
    <label for="sort">Sort by</label>

    <select id="sort" name="sort">
        <option value="Popular">Featured</option>
        <option value="Low-high">Price: Low to high</option>
        <option value="High-low">Price: high to low</option>
        <option value="Newest">Price: Newest</option>
    </select>
   </div>
