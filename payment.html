<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | The Beauty Bar</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>CHECKOUT</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="Category.html">Category</a>
            <a href="Cart.html">Cart</a>
        </nav>
    </header>

    <main class="container narrow">
        <h2>Order Summary</h2>

        <div id="checkout-items"></div>
        <h3 id="checkout-total">Total: R0</h3>

        <form id="checkout-form" class="form-card">
            <label for="checkout-name">Full Name</label>
            <input type="text" id="checkout-name" name="name"
                   minlength="2" required>

            <label for="checkout-email">Email Address</label>
            <input type="email" id="checkout-email" name="email" required>

            <label for="checkout-phone">Phone Number</label>
            <input type="tel" id="checkout-phone" name="phone"
                   pattern="[0-9 +()\-]{7,20}" required>

            <label for="checkout-address">Delivery Address</label>
            <textarea id="checkout-address" name="address"
                      minlength="5" required></textarea>

            <label for="checkout-payment">Payment Method</label>
            <select id="checkout-payment" required>
                <option value="">Choose a payment method</option>
                <option value="cash">Cash on Delivery</option>
                <option value="eft">EFT</option>
                <option value="card">Card</option>
            </select>

            <button type="submit">Place Demo Order</button>

            <p id="checkout-feedback" class="form-feedback"
               role="status"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 The Beauty Bar</p>
    </footer>

</body>
</html>
