<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | The Beauty Bar</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>CREATE AN ACCOUNT</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Log In</a>
        </nav>
    </header>

    <main class="container narrow">
        <form id="account-form" class="form-card">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" minlength="2" required>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" minlength="2" required>

            <label for="account-email">Email Address</label>
            <input type="email" id="account-email" required>

            <label for="account-password">Password (at least 8 characters)</label>
            <input type="password" id="account-password" minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" minlength="8" required>

            <button type="submit">Create Account</button>

            <p id="account-feedback" class="form-feedback" role="status"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 The Beauty Bar</p>
    </footer>

</body>
</html>
